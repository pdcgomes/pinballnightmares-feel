<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0714" />
    <!-- No icon yet: an empty one, so browsers don't ask the host for /favicon.ico and log its 404. -->
    <link rel="icon" href="data:," />
    <title>Pinball Nightmares: feel lab (5ec8927)</title>
    <style>
      /* A game's page, from Alfama's pitfalls: no browser gestures, no selection, no tap
         highlight, no scrolling, the picture under the notch and home bar (viewport-fit=cover)
         with the game keeping its content inside the safe area itself. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0714;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* One canvas over the whole page; src/game/fit.ts places the table and the display in it,
         by whole device pixels. */
      canvas#view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        image-rendering: pixelated;
      }
      /* The safe area's insets, which main.ts reads. */
      #safe {
        position: fixed;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      /* The debug and perf readout (?debug, ?perf). */
      #readout {
        position: fixed;
        left: max(6px, env(safe-area-inset-left));
        top: max(6px, env(safe-area-inset-top));
        margin: 0;
        padding: 6px 8px;
        font: 11px/1.35 ui-monospace, Menlo, monospace;
        color: #d8f7ec;
        background: rgba(6, 3, 12, 0.72);
        white-space: pre;
        pointer-events: none;
      }
      #readout:empty {
        display: none;
      }
      /* The tuning bench (?tune, src/game/tunepanel.ts), in the room left of the table; main.ts
         sets --tune-width from the fit. With it, the debug readout moves to the right. */
      body.tuning #readout {
        left: auto;
        right: max(6px, env(safe-area-inset-right));
      }
      #tune {
        position: fixed;
        z-index: 2;
        left: max(8px, env(safe-area-inset-left));
        top: max(8px, env(safe-area-inset-top));
        bottom: max(8px, env(safe-area-inset-bottom));
        width: var(--tune-width, 360px);
        box-sizing: border-box;
        overflow-y: auto;
        padding: 8px 12px 12px;
        background: rgba(10, 6, 20, 0.92);
        border: 1px solid #3b2a63;
        color: #d8f7ec;
        font: 12px/1.35 ui-monospace, Menlo, monospace;
        touch-action: auto;
      }
      #tune[hidden] {
        display: none;
      }
      #tune header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      #tune h2 {
        margin: 2px 0 6px;
        font-size: 13px;
        letter-spacing: 0.12em;
        color: #ffb055;
      }
      #tune h3 {
        margin: 12px 0 4px;
        font-size: 11px;
        font-weight: normal;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #9a74c4;
      }
      #tune .tune-hint,
      #tune .tune-own,
      #tune .tune-note {
        color: #8b84a3;
      }
      #tune .tune-row {
        margin: 4px 0 2px;
      }
      #tune .tune-label {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }
      #tune .tune-right {
        display: flex;
        align-items: baseline;
        gap: 6px;
        white-space: nowrap;
      }
      #tune details {
        margin-top: 12px;
      }
      #tune summary {
        cursor: pointer;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #9a74c4;
      }
      #tune .tune-value {
        color: #fff2b0;
      }
      #tune .tune-changed .tune-value {
        color: #ff9a2a;
      }
      #tune input[type="range"] {
        width: 100%;
        margin: 2px 0;
        accent-color: #ff9a2a;
      }
      #tune input[type="range"]:disabled {
        opacity: 0.35;
      }
      #tune select,
      #tune button {
        font: inherit;
        color: #d8f7ec;
        background: #1c1230;
        border: 1px solid #43296a;
        padding: 3px 8px;
      }
      #tune select {
        width: 100%;
      }
      #tune .tune-modes {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
      }
      #tune .tune-mode.tune-on {
        background: #5b3a86;
        color: #fff2b0;
      }
      #tune .tune-reset {
        padding: 0 6px;
        line-height: 1.2;
      }
      #tune .tune-readout {
        margin: 0;
        white-space: pre-wrap;
        color: #b9f0dc;
      }
      #tune .tune-keep {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        margin-bottom: 4px;
      }
      #tune .tune-copy {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        font: 11px/1.3 ui-monospace, Menlo, monospace;
        color: #d8f7ec;
        background: #120a22;
        border: 1px solid #43296a;
        user-select: text;
        -webkit-user-select: text;
      }
      #error {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #ffd27a;
        font: 16px/1.5 ui-monospace, Menlo, monospace;
        text-align: center;
      }
      #error[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="safe"></div>
    <pre id="readout"></pre>
    <div id="error" hidden></div>
    <script>
      // The shared feel lab opens on the tuning bench, whatever link it's given.
      if (!new URLSearchParams(location.search).has("tune")) {
        const at = location.pathname + (location.search ? location.search + "&tune" : "?tune") + location.hash;
        try {
          history.replaceState(null, "", at);
        } catch {
          location.replace(at);
        }
      }
    </script>
    <script type="module" src="dist/game.js"></script>
  </body>
</html>
