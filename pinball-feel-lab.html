      html,

        top: max(6px, env(safe-area-inset-top));

        font: 11px/1.35 ui-monospace, Menlo, monospace;
        color: #d8f7ec;
        background: rgba(6, 3, 12, 0.72);
        white-space: pre;
        pointer-events: none;
      }
      #readout:empty {
        display: none;
      }

      body.tuning #readout {

00 },\n        { \"on\": \"lane.roll\", \"when\": { \"lit\": true }, \"points\": 10000 },\n        { \"on\": \"lane.roll\", \"when\": { \"lit\": false }, \"points\": 1000 },\n        { \"on\": \"loop.made\", \"points\": 100000, \"plus\": 25000, \"per\": \"loops\", \"most\": 300000 },\n        { \"on\": \"torchlanes.complete\", \"when\": { \"raised\": true }, \"points\": 100000 },\n        { \"on\": \"torchlanes.complete\", \"when\": { \"raised\": false }, \"points\": 500000, \"notes\": \"At 5x the multiplier can't rise: 500,000 instead\" },\n        { \"on\": \"tidelanes.complete\", \"points\": 100000 }\n      ]\n    },\n    {\n      \"id\": \"combo\",\n      \"priority\": 200,\n      \"band\": \"rules\",\n      \"runs\": \"game\",\n      \"combo\": {\n        \"shots\": [\"loop.left\", \"loop.right\"],\n        \"window\": 4000,\n        \"most\": 5,\n        \"hurry\": 1000,\n        \"next\": { \"loop.left\": [\"loop.right\"], \"loop.right\": [\"loop.left\"] },\n        \"ladders\": [\n          [\"ladder.loop-left.1\", \"ladder.loop-left.2\", \"ladder.loop-left.3\"],\n          [\"ladder.loop-right.1\", \"ladder.loop-right.2\", \"ladder.loop-right.3\"]\n        ],\n        \"steps\": { \"2\": \"COMBO\", \"3\": \"SUPER COMBO\", \"4\": \"RIPTIDE\", \"5\": \"TIDAL WAVE\", \"6\": \"MAELSTROM\" },\n        \"named\": [\n          {\n            \"name\": \"figure-eight\",\n            \"title\": \"FIGURE EIGHT\",\n            \"inRow\": [\n              [\"loop.left\", \"loop.right\", \"loop.left\"],\n              [\"loop.right\", \"loop.left\", \"loop.right\"]\n            ],\n            \"award\": 1000000\n          }\n        ],\n        \"notes\": \"A loop returns to the far flipper, which makes the other loop: the continuing shot is the other loop (table bible 2.4, 3.5 and 7.3)\"\n      },\n      \"scores\": [\n        { \"on\": \"combo.step\", \"points\": \"extra\", \"source\": \"combo\", \"notes\": \"The nth shot scores its value times n: the shot its value, on\": 0.06 },\n    \"rubber\": { \"restitution\": [[0, 0.7], [300, 0.8], [1200, 0.85], [2400, 0.8]], \"friction\": 0.2 },\n    \"flipper\": { \"restitution\": [[0, 0.1], [900, 0.12], [1500, 0.45], [2800, 0.55]], \"friction\": 0.4 }\n  }\n}\n","tables/lab/feel/real.json":"{\n  \"name\": \"real\"\n}\n","tables/lab/feel/snappy.json":"{\n  \"name\": \"snappy\",\n  \"gravity\": 1105,\n  \"maxSpeed\": 2600,\n  \"flipper\": { \"upSpeed\": 60, \"upAccel\": 60000, \"downSpeed\": 50, \"downAccel\": 5000 },\n  \"materials\": {\n    \"metal\": { \"restitution\": [[0, 0.55], [600, 0.6], [2400, 0.55]], \"friction\": 0.05 },\n    \"wood\": { \"restitution\": [[0, 0.5], [600, 0.55], [2400, 0.5]], \"friction\": 0.1 },\n    \"plastic\": { \"restitution\": [[0, 0.5], [600, 0.55], [2400, 0.5]], \"friction\": 0.08 },\n    \"rubber\": { \"restitution\": [[0, 0.65], [300, 0.75], [1200, 0.8], [2400, 0.75]], \"friction\": 0.25 },\n    \"flipper\": { \"restitution\": [[0, 0.1], [1000, 0.12], [1700, 0.45], [3000, 0.55]], \"friction\": 0.4 }\n  }\n}\n","tables/lab/shows/attract.json":"{\n  \"id\": \"attract\",\n  \"description\": \"The feel lab's attract (the lighting bible's 6.2 and 9.7), a 40-beat loop, 20 s at 120 BPM: night, a sweep up the inserts every 4 beats; the lamp test, each family flickering in turn; patterns, sweeps down and across and a radial from the caps, the two regions alternating on the beat; torchlight, the caps turning and the flasher swelling. Accents only on the inserts, so it can run over a game's lamps too; it keeps to the flash budget.\",\n  \"tier\": 0,\n  \"units\": \"beats\",\n  \"length\": 40,\n  \"loop\": true,\n  \"envelopes\": {\n    \"glow\": [\n      { \"t\": 0, \"level\": \"under\" },\n      { \"t\": 0.06, \"level\": 7, \"ease\": \"linear\" },\n      { \"t\": 0.24, \"level\": \"under\", \"ease\": \"linear\" }\n    ],\n    \"swell\": [\n      { \"t\": 0, \"level\": \"under\" },\n      { \"t\": 1, \"level\": 6, \"ease\": \"inOut\" },\n      { \"t\": 2, \"level\": \"under\", \"ease\": \"inOut\" }\n    ]\n  },\n  \"tracks\": [\n    { \"lamps\": \"gi\", \"keys\": [{ \"t\": 0, \"level\": 3 }, { \"t\": 6, \"level\": 3 }, { \"t\": 8, \"level\": 7, \"ease\": \"inOut\" }], \"to\": 8 },\n    { \"lamps\": \"inserts\", \"blend\": \"accent\", \"envelope\": \"glint\", \"sweep\": { \"dir\": \"up\", \"duration\": 2, \"ease\": \"linear\" }, \"to\": 4 },\n    { \"lamps\": \"inserts\", \"blend\": \"accent\", \"envelope\": \"glint\", \"sweep\": { \"dir\": \"up\", \"duration\": 2, \"ease\": \"linear\" }, \"from\": 4, \"to\": 8 },\n    { \"lamps\": \"arrows\", \"blend\": \"accent\", \"envelope\": \"glow\", \"chase\": { \"step\": 0.5, \"on\": 1, \"off\": 0 }, \"from\": 8, \"to\": 10 },\n    { \"lamps\": \"ladders\", \"blend\": \"accent\", \"envelope\": \"glow\", \"chase\": { \"step\": 0.5, \"on\": 1, \"off\": 0 }, \"from\": 10, \"to\": 12 },\n    { \"lamps\": \"lanes\", \"blend\": \"accent\", \"envelope\": \"glow\", \"chase\": { \"step\": 0.5, \"on\": 1, \"off\": 0 }, \"from\": 12, \"to\": 14 },\n    { \"lamps\": [\"meter.plunger\", \"shoot-again\"], \"blend\": \"accent\", \"envelope\": \"glow\", \"chase\": { \"step\": 0.5, \"on\": 1, \"off\": 0 }, \"from\": 14, \"to\": 16 },\n    { \"lamps\": \"inserts\", \"blend\": \"accent\", \"envelope\": \"glint\", \"from\": 16, \"to\": 20, \"sweep\": { \"dir\": \"down\", \"duration\": 2, \"ease\": \"out\" } },\n    { \"lamps\": \"inserts\", \"blend\": \"accent\", \"envelope\": \"glint\", \"from\": 20, \"to\": 24, \"sweep\": { \"dir\": \"right\", \"duration\": 2, \"ease\": \"out\" } },\n    { \"lamps\": \"inserts\", \"blend\": \"accent\", \"envelope\": \"glint\", \"from\": 24, \"to\": 28, \"radial\": { \"origin\": \"caps\", \"speed\": 400, \"rings\": 2, \"gap\": 0.5 } },\n    { \"lamps\": \"gi.upper\", \"envelope\": \"swell\", \"at\": [16, 20, 24], \"from\": 0, \"to\": 28 },\n    { \"lamps\": \"gi.lower\", \"envelope\": \"swell\", \"at\": [18, 22, 26], \"from\": 0, \"to\": 28 },\n    { \"lamps\": \"caps\", \"envelope\": \"blip\", \"rotate\": { \"turn\": 1.5 }, \"from\": 28, \"to\": 40 },\n    { \"lamps\": \"flasher.orbit\", \"envelope\": \"swell\", \"at\": [32, 36], \"from\": 0, \"to\": 40 }\n  ]\n}\n","tables/lab/shows/ball-start.json":"{\n  \"id\": \"ball-start\",\n  \"description\": \"The ball start (6.3), a loop in beats until the launch stops it: the plunger lane's lamps chase up toward the launch, two a beat, one lit in four, over whatever the meter shows.\",\n  \"tier\": 0,\n  \"units\": \"beats\",\n  \"length\": 2,\n  \"loop\": true,\n  \"tracks\": [{ \"lamps\": \"meter.plunger\", \"blend\": \"accent\", \"envelope\": \"glint\", \"chase\": { \"step\": 0.5, \"on\": 1, \"off\": 3 } }]\n}\n","tables/lab/shows/caps-turn.json":"{\n  \"id\": \"caps-turn\",\n  \"description\": \"T2, the three buoys hit within 1,000 ms (light.bumper, 5.3): one turn round the three caps, 80 ms each.\",\n  \"tier\": 2,\n  \"length\": 400,\n  \"tracks\": [{ \"lamps\": \"caps\", \"envelope\": \"blip\", \"rotate\": { \"turn\": 240 } }]\n}\n","tables/lab/shows/climax.json":"{\n  \"id\": \"climax\",\n  \"description\": \"T5 at a shot (5.1), the combo from its fifth rung: the general illumination draws breath and comes back hot, its flasher bursts twice (three large flashes in the first second, the budget), two rings over every insert, the ladder chasing toward the shot, the return landing on a beat.\",\n  \"tier\": 5,\n  \"length\": 2400,\n  \"tokens\": { \"shot\": \"loop-left\", \"colour\": \"white\", \"region\": \"gi.upper\" },\n  \"tracks\": [\n    {\n      \"lamps\": \"gi\",\n      \"keys\": [\n        { \"t\": 0, \"level\": 2 },\n        { \"t\": 120, \"level\": 8, \"colour\": \"$colour\" },\n        { \"t\": 520, \"level\": 8 },\n        { \"t\": 2400, \"level\": \"under\", \"ease\": \"inOut\", \"land\": true }\n      ]\n    },\n    { \"lamps\": \"flasher.$shot\", \"envelope\": \"burst\", \"at\": [340, 680] },\n    { \"lamps\": \"inserts\", \"blend\": \"accent\", \"envelope\": \"glint\", \"radial\": { \"origin\": \"arrow.$shot\", \"speed\": 700, \"rings\": 2 } },\n    { \"lamps\": \"ladder.$shot\", \"blend\": \"accent\", \"envelope\": \"glint\", \"from\": 700, \"chase\": { \"step\": \"0.25b\", \"toward\": \"arrow.$shot\" } }\n  ]\n}\n","tables/lab/shows/combo-end.json":"{\n  \"id\": \"combo-end\",\n  \"description\": \"N2, light.combo-end (5.3): the chain broken or ended. The rules' continuing shots fade out over 300 ms; over them a dim glint drains down both ladders, away from the arrows. Nothing brightens.\",\n  \"tier\": \"N2\",\n  \"length\": 500,\n  \"envelopes\": {\n    \"ebb\": [\n      { \"t\": 0, \"level\": \"under\" },\n      { \"t\": 20, \"level\": 4, \"ease\": \"linear\" },\n      { \"t\": 100, \"level\": \"under\", \"ease\": \"linear\" }\n    ]\n  },\n  \"tracks\": [{ \"lamps\": \"ladders\", \"blend\": \"accent\", \"envelope\": \"ebb\", \"sweep\": { \"dir\": \"down\", \"duration\": 300, \"ease\": \"linear\" } }]\n}\n","tables/lab/shows/drain-one.json":"{\n  \"id\": \"drain-one\",\n  \"description\": \"N1, light.drain-one (5.3): a ball lost with others in play: the lower region dips two levels for 120 ms, and play goes on.\",\n  \"tier\": \"N1\",\n  \"length\": 300,\n  \"tracks\": [\n    {\n      \"lamps\": \"gi.lower\",\n      \"keys\": [\n        { \"t\": 0, \"level\": -2 },\n        { \"t\": 120, \"level\": \"under\" }\n      ]\n    }\n  ]\n}\n","tables/lab/shows/drain.json":"{\n  \"id\": \"drain\",\n  \"description\": \"N2, light.drain (5.3): the light pours down the table into the falls, each region down to the drain look's 2 as the wipe reaches it, over 700 ms; the drain look holds it there until the next ball. Nothing brightens; the inserts keep their states.\",\n  \"tier\": \"N2\",\n  \"length\": 1200,\n  \"tracks\": [\n    {\n      \"lamps\": \"gi\",\n      \"envelope\": [\n        { \"t\": 0, \"level\": \"under\" },\n        { \"t\": 300, \"level\": 2, \"ease\": \"linear\" }\n      ],\n      \"sweep\": { \"dir\": \"down\", \"duration\": 400, \"ease\": \"linear\" }\n    }\n  ]\n}\n","tables/lab/shows/envelopes.json":"{\n  \"description\": \"The shared envelopes (lighting bible, 4.2): keyframes of level over milliseconds, each key in the show schema's key format. under is whatever the claims below show; a negative level is that many levels below under; a key jumps unless it has an ease.\",\n  \"envelopes\": {\n    \"blip\": [\n      { \"t\": 0, \"level\": 8 },\n      { \"t\": 30, \"level\": 8 },\n      { \"t\": 120, \"level\": \"under\", \"ease\": \"linear\" }\n    ],\n    \"set\": [\n      { \"t\": 0, \"level\": 8 },\n      { \"t\": 60, \"level\": 7 }\n    ],\n    \"glint\": [\n      { \"t\": 0, \"level\": \"under\" },\n      { \"t\": 16, \"level\": 8, \"ease\": \"linear\" },\n      { \"t\": 90, \"level\": \"under\", \"ease\": \"linear\" }\n    ],\n    \"flash\": [\n      { \"t\": 0, \"level\": \"under\" },\n      { \"t\": 8, \"level\": 8, \"ease\": \"linear\" },\n      { \"t\": 48, \"level\": 8 },\n      { \"t\": 248, \"level\": \"under\", \"ease\": \"out\" }\n    ],\n    \"burst\": [\n      { \"t\": 0, \"level\": \"under\" },\n      { \"t\": 8, \"level\": 8, \"ease\": \"linear\" },\n      { \"t\": 88, \"level\": 8 },\n      { \"t\": 488, \"level\": \"under\", \"ease\": \"out\" }\n    ],\n    \"swell\": [\n      { \"t\": 0, \"level\": \"under\" },\n      { \"t\": 250, \"level\": 6, \"ease\": \"inOut\" },\n      { \"t\": 350, \"level\": 6 },\n      { \"t\": 850, \"level\": \"under\", \"ease\": \"inOut\" }\n    ],\n    \"flare\": [\n      { \"t\": 0, \"level\": \"under\" },\n      { \"t\": 40, \"level\": 8, \"ease\": \"linear\" },\n      { \"t\": 240, \"level\": 8 },\n      { \"t\": 840, \"level\": \"under\", \"ease\": \"out\" }\n    ],\n    \"dip\": [\n      { \"t\": 0, \"level\": -3 },\n      { \"t\": 200, \"level\": \"under\" }\n    ],\n    \"on\": [{ \"t\": 0, \"level\": 7 }],\n    \"off\": [{ \"t\": 0, \"level\": 0 }]\n  }\n}\n","tables/lab/shows/feature.json":"{\n  \"id\": \"feature\",\n  \"description\": \"T4 at a shot (5.1), the combo's third and fourth rungs and the skill shot: two rings over every insert from the shot, the whole general illumination hot in the answer's colour (up in 120 ms, back over 500), its flasher twice.\",\n  \"tier\": 4,\n  \"length\": 1000,\n  \"tokens\": { \"shot\": \"loop-left\", \"colour\": \"gold\", \"region\": \"gi.upper\" },\n  \"tracks\": [\n    { \"lamps\": \"inserts\", \"blend\": \"accent\", \"envelope\": \"glint\", \"radial\": { \"origin\": \"arrow.$shot\", \"speed\": 700, \"rings\": 2 } },\n    {\n      \"lamps\": \"gi\",\n      \"keys\": [\n        { \"t\": 0, \"level\": \"under\" },\n        { \"t\": 120, \"level\": 8, \"colour\": \"$colour\", \"ease\": \"linear\" },\n        { \"t\": 620, \"level\": \"under\", \"ease\": \"out\" }\n      ]\n    },\n    { \"lamps\": \"flasher.$shot\", \"envelope\": \"flash\", \"at\": [0, 420] },\n    { \"lamps\": \"arrow.$shot\", \"blend\": \"accent\", \"envelope\": \"glint\", \"at\": [0] }\n  ]\n}\n","tables/lab/shows/index.json":"{\n  \"notes\": \"The feel lab's shows (the lighting bible's 9.7), each a file in the bible's format (docs/studio/lighting-bible/show.schema.json), and the envelopes they share. src/show/load.ts reads this list and validates every show as it loads.\",\n  \"envelopes\": \"envelopes.json\",\n  \"shows\": [\n    \"touch\",\n    \"lane-roll\",\n    \"lane-slide\",\n    \"lanes-complete\",\n    \"loop-in\",\n    \"caps-turn\",\n    \"launch\",\n    \"ball-start\",\n    \"wipe-up\",\n    \"power-on\",\n    \"drain\",\n    \"drain-one\",\n    \"saved\",\n    \"tilt-warn\",\n    \"mark\",\n    \"score\",\n    \"feature\",\n    \"climax\",\n    \"combo-end\",\n    \"multiball-start\",\n    \"jackpot\",\n    \"attract\"\n  ]\n}\n","tables/lab/shows/jackpot.json":"{\n  \"id\": \"jackpot\",\n  \"description\": \"T5, light.jackpot (the lighting bible's 4.6) on the lab: the general illumination draws breath and comes back hot in gold, the flasher bursts twice, two rings run out from the shot over every insert, its ladder chases toward it, and the return to the look lands on a beat. Three large flashes in the first second. The lab has no torches to flare.\",\n  \"tier\": 5,\n  \"length\": 2400,\n  \"tokens\": { \"shot\": \"loop-left\", \"colour\": \"gold\" },\n  \"tracks\": [\n    {\n      \"lamps\": \"gi\",\n      \"keys\": [\n        { \"t\": 0, \"level\": 2 },\n        { \"t\": 120, \"level\": 8, \"colour\": \"$colour\" },\n        { \"t\": 520, \"level\": 8 },\n        { \"t\": 2400, \"level\": \"under\", \"ease\": \"inOut\", \"land\": true }\n      ]\n    },\n    { \"lamps\": \"flasher.$shot\", \"envelope\": \"burst\", \"at\": [340, 680] },\n    { \"lamps\": \"inserts\", \"blend\": \"accent\", \"envelope\": \"glint\", \"radial\": { \"origin\": \"arrow.$shot\", \"speed\": 700, \"rings\": 2 } },\n    { \"lamps\": \"ladder.$shot\", \"blend\": \"accent\", \"envelope\": \"glint\", \"from\": 700, \"chase\": { \"step\": \"0.25b\", \"toward\": \"arrow.$shot\" } }\n  ]\n}\n","tables/lab/shows/lane-roll.json":"{\n  \"id\": \"lane-roll\",\n  \"description\": \"T1, light.lane (5.3): the ball rolling over a lane blips its lamp, an accent, so a lane the rules have lit stays lit and an unlit one only flickers past (R4). The rules' set lights the lamp when they land.\",\n  \"tier\": 1,\n  \"length\": 200,\n  \"tokens\": { \"lamp\": \"lane.t\" },\n  \"tracks\": [{ \"lamps\": \"$lamp\", \"blend\": \"accent\", \"envelope\": \"blip\" }]\n}\n","tables/lab/shows/lane-slide.json":"{\n  \"id\": \"lane-slide\",\n  \"description\": \"T1, lane.change (5.3, R10): a glint across the set in 60 ms the way the lit lanes slide, so the eye follows the rules moving them.\",\n  \"tier\": 1,\n  \"length\": 200,\n  \"tokens\": { \"set\": \"lanes.torch\" },\n  \"tracks\": [{ \"lamps\": \"$set\", \"blend\": \"accent\", \"envelope\": \"glint\", \"sweep\": { \"dir\": \"right\", \"duration\": 60, \"ease\": \"linear\" } }]\n}\n","tables/lab/shows/lanes-complete.json":"{\n  \"id\": \"lanes-complete\",\n  \"description\": \"T3, light.lane for the set (torchlanes.complete, tidelanes.complete; 5.2 and 5.3): the set flashes three times at 8 Hz, accents on small lamps, then resets with a chase, 60 ms a lamp; its region hot for 200 ms; a local ripple over the inserts round it (reach 96 px).\",\n  \"tier\": 3,\n  \"length\": 900,\n  \"tokens\": { \"set\": \"lanes.tide\", \"region\": \"gi.lower\" },\n  \"envelopes\": {\n    \"strobe\": [\n      { \"t\": 0, \"level\": 8 },\n      { \"t\": 60, \"level\": 8 },\n      { \"t\": 62, \"level\": \"under\" }\n    ]\n  },\n  \"tracks\": [\n    { \"lamps\": \"$set\", \"blend\": \"accent\", \"envelope\": \"strobe\", \"at\": [0, 125, 250] },\n    { \"lamps\": \"$set\", \"blend\": \"accent\", \"envelope\": \"glint\", \"from\": 420, \"sweep\": { \"dir\": \"right\", \"duration\": 180, \"ease\": \"linear\" } },\n    {\n      \"lamps\": \"$region\",\n      \"keys\": [\n        { \"t\": 0, \"level\": 8, \"colour\": \"amber\" },\n        { \"t\": 200, \"level\": \"under\", \"ease\": \"linear\" }\n      ]\n    },\n    { \"lamps\": \"inserts\", \"blend\": \"accent\", \"envelope\": \"glint\", \"radial\": { \"origin\": \"$set\", \"speed\": 500, \"reach\": 96 } }\n  ]\n}\n","tables/lab/shows/launch.json":"{\n  \"id\": \"launch\",\n  \"description\": \"T2, light.launch (5.3): the plunger lane's lamps sweep up with the ball in 300 ms, and the lower region is hot for 120 ms.\",\n  \"tier\": 2,\n  \"length\": 500,\n  \"tracks\": [\n    { \"lamps\": \"meter.plunger\", \"blend\": \"accent\", \"envelope\": \"glint\", \"sweep\": { \"dir\": \"up\", \"duration\": 300, \"ease\": \"in\" } },\n    {\n      \"lamps\": \"gi.lower\",\n      \"keys\": [\n        { \"t\": 0, \"level\": 8, \"colour\": \"amber\" },\n        { \"t\": 120, \"level\": \"under\", \"ease\": \"linear\" }\n      ]\n    }\n  ]\n}\n","tables/lab/shows/loop-in.json":"{\n  \"id\": \"loop-in\",\n  \"description\": \"T1, the ball going up a loop's lane (loop.enter with the ball moving up): the light runs up the loop's ladder into its arrow with the ball, 40 ms a lamp. A stand-in until the rules' loop.made brings light.orbit; accents only, so the rules' lit states hold.\",\n  \"tier\": 1,\n  \"length\": 200,\n  \"tokens\": { \"shot\": \"loop-left\" },\n  \"tracks\": [\n    { \"lamps\": \"ladder.$shot\", \"blend\": \"accent\", \"envelope\": \"glint\", \"fill\": { \"count\": 3, \"step\": 40 } },\n    { \"lamps\": \"arrow.$shot\", \"blend\": \"accent\", \"envelope\": \"glint\", \"at\": [110] }\n  ]\n}\n","tables/lab/shows/mark.json":"{\n  \"id\": \"mark\",\n  \"description\": \"T2 at a shot (5.1), the combo's first rung and any shot made: its arrow glints, a sweep along its ladder toward it, its region hot for 120 ms in the answer's colour.\",\n  \"tier\": 2,\n  \"length\": 500,\n  \"tokens\": { \"shot\": \"loop-left\", \"colour\": \"amber\", \"region\": \"gi.upper\" },\n  \"tracks\": [\n    { \"lamps\": \"ladder.$shot\", \"blend\": \"accent\", \"envelope\": \"glint\", \"fill\": { \"count\": 3, \"step\": 40 } },\n    { \"lamps\": \"arrow.$shot\", \"blend\": \"accent\", \"envelope\": \"glint\", \"at\": [110] },\n    {\n      \"lamps\": \"$region\",\n      \"keys\": [\n        { \"t\": 0, \"level\": 8, \"colour\": \"$colour\" },\n        { \"t\": 120, \"level\": \"under\", \"ease\": \"linear\" }\n      ]\n    }\n  ]\n}\n","tables/lab/shows/multiball-start.json":"{\n  \"id\": \"multiball-start\",\n  \"description\": \"T5, light.multiball (5.3): while its balls are held, it seizes the table. The general illumination goes to 1 and every insert out for 300 ms, the lagoon dark; then the light comes back hot from the origin with two rings over the inserts and the flasher bursting twice (three large flashes); when the seize ends, its reveal shows what's lit, and the multiball look takes over.\",\n  \"tier\": 5,\n  \"length\": 2200,\n  \"seize\": \"whenHeld\",\n  \"tokens\": { \"origin\": \"caps\", \"colour\": \"gold\" },\n  \"tracks\": [\n    {\n      \"lamps\": \"gi\",\n      \"keys\": [\n        { \"t\": 0, \"level\": 1 },\n        { \"t\": 300, \"level\": 8, \"colour\": \"$colour\" },\n        { \"t\": 700, \"level\": 8 },\n        { \"t\": 2200, \"level\": \"under\", \"ease\": \"inOut\", \"land\": true }\n      ]\n    },\n    {\n      \"lamps\": \"inserts\",\n      \"keys\": [\n        { \"t\": 0, \"level\": 0 },\n        { \"t\": 300, \"level\": \"under\" }\n      ]\n    },\n    { \"lamps\": [\"caps\", \"slings\"], \"keys\": [{ \"t\": 0, \"level\": 0 }, { \"t\": 300, \"level\": \"under\" }], \"to\": 300 },\n    { \"lamps\": \"inserts\", \"envelope\": \"glint\", \"from\": 300, \"radial\": { \"origin\": \"$origin\", \"speed\": 700, \"rings\": 2 } },\n    { \"lamps\": \"flasher.orbit\", \"envelope\": \"burst\", \"at\": [450, 800] }\n  ]\n}\n","tables/lab/shows/power-on.json":"{\n  \"id\": \"power-on\",\n  \"description\": \"Game start (6.3): the general illumination held dark while a sweep catches each region from the flippers up, each with one electric flicker (out for 40 ms); then every insert glints in a sweep up, like an old machine waking.\",\n  \"tier\": 4,\n  \"length\": 1600,\n  \"tracks\": [\n    { \"lamps\": \"gi\", \"keys\": [{ \"t\": 0, \"level\": 0 }] },\n    {\n      \"lamps\": \"gi\",\n      \"keys\": [\n        { \"t\": 0, \"level\": 7 },\n        { \"t\": 60, \"level\": 0 },\n        { \"t\": 100, \"level\": 7 }\n      ],\n      \"sweep\": { \"dir\": \"up\", \"duration\": 300, \"ease\": \"linear\" }\n    },\n    { \"lamps\": [\"caps\", \"slings\"], \"keys\": [{ \"t\": 0, \"level\": 0 }], \"to\": 500 },\n    { \"lamps\": \"inserts\", \"blend\": \"accent\", \"envelope\": \"glint\", \"from\": 1100, \"sweep\": { \"dir\": \"up\", \"duration\": 400 } }\n  ]\n}\n","tables/lab/shows/saved.json":"{\n  \"id\": \"saved\",\n  \"description\": \"T3, light.saved (ballsave.save, 5.3): the light surges back up the table from the falls, each region hot in moon-white as the wave
